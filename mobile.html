<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>スマホ接続用 QRコード - AsoBo</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%236366f1'/><circle cx='50' cy='50' r='30' fill='white'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: #eef2ff;
      --bg-body: #f8fafc;
      --bg-card: #ffffff;
      --text-main: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --radius-lg: 20px;
      --radius-md: 12px;
      --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', 'Noto Sans JP', -apple-system, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 100%);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .connect-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 32px 24px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: var(--shadow-lg);
    }
    .qr-frame {
      background: #ffffff;
      padding: 16px;
      border-radius: 16px;
      display: inline-block;
      margin: 18px 0;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      border: 1px solid #e2e8f0;
    }
    .url-badge {
      background: #f1f5f9;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 600;
      color: var(--primary);
      word-break: break-all;
      border: 1px solid var(--border-color);
      margin-bottom: 20px;
      user-select: all;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
      border: none;
      box-sizing: border-box;
    }
    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }
    .btn-primary:hover {
      background: var(--primary-hover);
    }
    .btn-secondary {
      background: #f1f5f9;
      color: #334155;
      border: 1px solid var(--border-color);
    }
    .btn-secondary:hover {
      background: #e2e8f0;
    }
  </style>
</head>
<body>
  <div class="connect-card">
    <div style="font-size: 40px; margin-bottom: 10px;">📱</div>
    <h1 style="font-size: 20px; font-weight: 800; margin-bottom: 6px; color: #1e293b;">スマホで AsoBo を開く</h1>
    <p style="font-size: 13px; color: var(--text-secondary); margin-bottom: 12px;">
      カメラでQRコードを読み取って直接アクセスできます
    </p>

    <div class="qr-frame">
      <img id="qr-img" src="" alt="QRコード" width="220" height="220" style="display:block; min-height: 220px; background: #fafafa;">
    </div>

    <div class="url-badge" id="target-url">
      読み込み中...
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <a id="btn-open-app" href="./index.html" class="btn btn-primary">
        📲 アプリ画面を開く
      </a>
      <button type="button" class="btn btn-secondary" onclick="copyAppUrl()">
        📋 URLをコピー
      </button>
    </div>

    <div style="margin-top: 24px; text-align: left; font-size: 12px; color: var(--text-muted); background: #f8fafc; padding: 14px; border-radius: var(--radius-md); border: 1px solid var(--border-color);">
      <strong>💡 スマホで便利に使うコツ（PWA）:</strong>
      <ul style="padding-left: 18px; margin-top: 8px; line-height: 1.6;">
        <li><strong>iPhone:</strong> Safari下部の共有ボタン →「ホーム画面に追加」</li>
        <li><strong>Android:</strong> Chrome右上のメニュー「︙」→「ホーム画面に追加」</li>
      </ul>
    </div>
  </div>

  <script>
    (function() {
      var currentUrl = new URL(window.location.href);
      currentUrl.pathname = currentUrl.pathname.replace(/\/mobile(\.html)?$/, '/index.html');
      if (!currentUrl.pathname.endsWith('index.html')) {
        currentUrl.pathname = currentUrl.pathname.replace(/\/?$/, '/index.html');
      }
      currentUrl.searchParams.set('openExternalBrowser', '1');
      var fullUrl = currentUrl.toString();

      document.getElementById('target-url').innerText = fullUrl;
      document.getElementById('btn-open-app').href = fullUrl;

      var qrImg = document.getElementById('qr-img');
      var qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=' + encodeURIComponent(fullUrl);
      qrImg.src = qrUrl;

      window.copyAppUrl = function() {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(fullUrl).then(function() {
            alert('URLをコピーしました！');
          }).catch(function() {
            fallbackCopy(fullUrl);
          });
        } else {
          fallbackCopy(fullUrl);
        }
      };

      function fallbackCopy(text) {
        var input = document.createElement('input');
        input.value = text;
        document.body.appendChild(input);
        input.select();
        document.execCommand('copy');
        document.body.removeChild(input);
        alert('URLをコピーしました！');
      }
    })();
  </script>
</body>
</html>
